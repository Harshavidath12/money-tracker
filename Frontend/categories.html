<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance Tracker - Categories</title>
  <script type="module" src="/src/categories.ts"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans flex flex-col">
  <div x-data="categoriesPage()" x-init="init()" class="max-w-6xl mx-auto p-6 flex-1 w-full">
    <!-- Navbar -->
    <nav class="flex justify-between items-center mb-10 py-4 border-b border-slate-800">
      <h1 class="text-2xl font-bold text-brand flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        FinanceTracker
      </h1>
      <div class="flex items-center gap-6">
        <a href="/" class="text-slate-400 hover:text-white transition">Dashboard</a>
        <a href="/transactions.html" class="text-slate-400 hover:text-white transition">Transactions</a>
        <a href="/categories.html" class="text-brand font-semibold">Categories</a>
        <div class="flex items-center gap-3 ml-4 pl-4 border-l border-slate-700">
          <span class="text-slate-300 text-sm" x-text="user.name"></span>
          <button @click="logout()" class="text-slate-400 hover:text-red-400 transition text-sm flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd" /></svg>
            Logout
          </button>
        </div>
      </div>
    </nav>

    <div class="flex justify-between items-center mb-8">
      <h2 class="text-xl font-bold">Category & Budget Settings</h2>
      <button @click="openModal()" class="bg-brand hover:bg-brand-dark text-white px-4 py-2 rounded-lg font-medium transition shadow-lg shadow-brand/30">
        + Add Category
      </button>
    </div>

    <!-- Categories Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <template x-for="cat in categories" :key="cat.id">
        <div class="glass-dark rounded-2xl p-6 transition transform hover:scale-105 duration-300 group">
          <div class="flex justify-between items-start mb-4">
            <div>
              <span class="px-2 py-1 rounded text-xs font-medium uppercase tracking-wider mb-2 inline-block" 
                    :class="cat.type === 'income' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'"
                    x-text="cat.type">
              </span>
              <h3 class="text-xl font-bold" x-text="cat.name"></h3>
            </div>
            <div class="flex items-center gap-2">
              <button @click="openModal(cat)" class="text-slate-500 hover:text-brand transition opacity-0 group-hover:opacity-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                </svg>
              </button>
              <button @click="deleteCategory(cat.id)" class="text-slate-500 hover:text-red-500 transition opacity-0 group-hover:opacity-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
              </button>
            </div>
          </div>
          
          <div x-show="cat.type === 'expense'">
            <h4 class="text-slate-400 text-sm mb-1">Monthly Budget Target</h4>
            <p class="text-2xl font-bold text-white" x-text="formatCurrency(cat.monthly_budget)"></p>
          </div>
        </div>
      </template>
    </div>

    <!-- Modal -->
    <div x-show="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" style="display: none;" x-transition>
      <div @click.away="showModal = false" class="bg-slate-800 rounded-2xl p-8 w-full max-w-md shadow-2xl border border-slate-700">
        <h2 class="text-2xl font-bold mb-6" x-text="editingCategory ? 'Edit Category' : 'New Category'"></h2>
        
        <form @submit.prevent="saveCategory">
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1">Name</label>
              <input type="text" x-model="form.name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand">
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1">Type</label>
              <select x-model="form.type" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand" :disabled="editingCategory">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>

            <div x-show="form.type === 'expense'">
              <label class="block text-sm font-medium text-slate-400 mb-1">Monthly Budget Limit (Rs)</label>
              <input type="number" step="0.01" x-model="form.monthly_budget" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand">
            </div>
          </div>

          <div class="mt-8 flex gap-4">
            <button type="button" @click="showModal = false" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-medium transition">Cancel</button>
            <button type="submit" class="flex-1 px-4 py-2 bg-brand hover:bg-brand-dark rounded-lg font-medium transition text-white">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-800 mt-auto py-5 text-center w-full">
    <p class="text-slate-400 text-sm">
      &copy; 2026 All Rights Reserved &mdash; Designed By : <span class="text-brand font-semibold">Vidath Harshitha</span>
    </p>
  </footer>

</body>
</html>
