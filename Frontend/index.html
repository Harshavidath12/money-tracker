<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance Tracker - Dashboard</title>
  <script type="module" src="/src/main.ts"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans flex flex-col">
  <div x-data="dashboard()" x-init="init()" class="max-w-6xl mx-auto p-6 flex-1 w-full">
    <!-- Navbar -->
    <nav class="flex justify-between items-center mb-10 py-4 border-b border-slate-800">
      <h1 class="text-2xl font-bold text-brand flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        FinanceTracker
      </h1>
      <div class="flex items-center gap-6">
        <a href="/" class="text-brand font-semibold">Dashboard</a>
        <a href="/transactions.html" class="text-slate-400 hover:text-white transition">Transactions</a>
        <a href="/categories.html" class="text-slate-400 hover:text-white transition">Categories</a>
        <div class="flex items-center gap-3 ml-4 pl-4 border-l border-slate-700">
          <span class="text-slate-300 text-sm" x-text="user.name"></span>
          <button @click="logout()" class="text-slate-400 hover:text-red-400 transition text-sm flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd" /></svg>
            Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- Instant Math Summary Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <div class="glass-dark rounded-2xl p-6 transition transform hover:scale-105 duration-300">
        <h3 class="text-slate-400 text-sm uppercase tracking-wider">Total Income</h3>
        <p class="text-3xl font-bold text-green-400 mt-2" x-text="formatCurrency(summary.totalIncome)"></p>
      </div>
      <div class="glass-dark rounded-2xl p-6 transition transform hover:scale-105 duration-300">
        <h3 class="text-slate-400 text-sm uppercase tracking-wider">Total Expenses</h3>
        <p class="text-3xl font-bold text-red-400 mt-2" x-text="formatCurrency(summary.totalExpense)"></p>
      </div>
      <div class="glass-dark rounded-2xl p-6 transition transform hover:scale-105 duration-300">
        <h3 class="text-slate-400 text-sm uppercase tracking-wider">Net Balance</h3>
        <p class="text-3xl font-bold text-brand-dark mt-2" :class="summary.netBalance < 0 ? 'text-red-400' : 'text-blue-400'" x-text="formatCurrency(summary.netBalance)"></p>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Charts Area -->
      <div class="lg:col-span-2 glass-dark rounded-2xl p-6">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold">Spending Trends</h2>
          <button @click="showTransactionModal = true" class="bg-brand hover:bg-brand-dark text-white px-4 py-2 rounded-lg font-medium transition shadow-lg shadow-brand/30">
            + Add Transaction
          </button>
        </div>
        <div class="w-full h-80">
          <canvas id="trendsChart"></canvas>
        </div>
      </div>

      <!-- Budget Progress Bars -->
      <div class="glass-dark rounded-2xl p-6">
        <h2 class="text-xl font-bold mb-6">Budget Limits</h2>
        <div class="space-y-6">
          <template x-for="cat in categories" :key="cat.id">
            <template x-if="cat.type === 'expense' && cat.monthly_budget > 0">
              <div>
                <div class="flex justify-between text-sm mb-2">
                  <span x-text="cat.name"></span>
                  <span><span x-text="formatCurrency(cat.transactions_sum_amount || 0)"></span> / <span class="text-slate-400" x-text="formatCurrency(cat.monthly_budget)"></span></span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-2.5">
                  <div class="h-2.5 rounded-full transition-all duration-1000" 
                       :class="getBudgetColor(cat.transactions_sum_amount || 0, cat.monthly_budget)"
                       :style="`width: ${Math.min(((cat.transactions_sum_amount || 0) / cat.monthly_budget) * 100, 100)}%`">
                  </div>
                </div>
              </div>
            </template>
          </template>
        </div>
      </div>

    </div>

    <!-- Alpine Modal for Add Transaction -->
    <div x-show="showTransactionModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" style="display: none;" x-transition>
      <div @click.away="showTransactionModal = false" class="bg-slate-800 rounded-2xl p-8 w-full max-w-md shadow-2xl border border-slate-700">
        <h2 class="text-2xl font-bold mb-6">New Transaction</h2>
        
        <form @submit.prevent="saveTransaction">
          <!-- Type Toggle -->
          <div class="flex bg-slate-700 rounded-lg p-1 mb-6">
            <button type="button" @click="newTx.type = 'expense'" :class="newTx.type === 'expense' ? 'bg-slate-600 text-white shadow' : 'text-slate-400'" class="flex-1 py-2 rounded-md text-sm font-medium transition">Expense</button>
            <button type="button" @click="newTx.type = 'income'" :class="newTx.type === 'income' ? 'bg-slate-600 text-white shadow' : 'text-slate-400'" class="flex-1 py-2 rounded-md text-sm font-medium transition">Income</button>
          </div>

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1">Amount</label>
              <input type="number" step="0.01" x-model="newTx.amount" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand">
            </div>
            
            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1">Category</label>
              <select x-model="newTx.category_id" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand">
                <option value="" disabled>Select a category</option>
                <template x-for="cat in filteredCategories" :key="cat.id">
                  <option :value="cat.id" x-text="cat.name"></option>
                </template>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1">Date</label>
              <input type="date" x-model="newTx.transaction_date" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand">
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1">Description</label>
              <input type="text" x-model="newTx.description" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand">
            </div>
          </div>

          <div class="mt-8 flex gap-4">
            <button type="button" @click="showTransactionModal = false" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-medium transition">Cancel</button>
            <button type="submit" class="flex-1 px-4 py-2 bg-brand hover:bg-brand-dark rounded-lg font-medium transition text-white">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-800 mt-auto py-5 text-center w-full">
    <p class="text-slate-400 text-sm">
      &copy; 2026 All Rights Reserved &mdash; Designed By : <span class="text-brand font-semibold">Vidath Harshitha</span>
    </p>
  </footer>

</body>
</html>
